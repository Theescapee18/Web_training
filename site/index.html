<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web_training 静态站点导航</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    h1 { font-size: 2.2rem; margin-bottom: .5rem; }
    p.sub { opacity: .8; margin-bottom: 2.5rem; }
    .grid { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; }
    .card {
      width: 200px;
      padding: 2rem 1.5rem;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 14px;
      text-align: center;
      text-decoration: none;
      color: #fff;
      transition: transform .2s, background .2s;
    }
    .card:hover { transform: translateY(-6px); background: rgba(255,255,255,.2); }
    .card .name { font-size: 1.6rem; font-weight: 700; }
    .card .desc { font-size: .85rem; opacity: .75; margin-top: .5rem; }
    footer { margin-top: 3rem; font-size: .8rem; opacity: .5; }
  </style>
</head>
<body>
  <h1>Web_training 静态站点</h1>
  <p class="sub">部署与维护训练 · 按成员划分的目录入口</p>
  <div class="grid">
    <a class="card" href="./TMF/">
      <div class="name">TMF</div>
      <div class="desc">成员 TMF 的作品</div>
    </a>
    <a class="card" href="./YLX/">
      <div class="name">YLX</div>
      <div class="desc">成员 YLX 的作品</div>
    </a>
    <a class="card" href="./ZLY/">
      <div class="name">ZLY</div>
      <div class="desc">成员 ZLY 的作品</div>
    </a>
  </div>
  <footer>Powered by Nginx · Deployed via GitHub Actions</footer>
</body>
</html>
