# =====================================================================
# Web_training 项目 —— Nginx 路由片段（location 片段，非独立 server）
# ---------------------------------------------------------------------
# 挂载方式：本项目不独占端口/域名，而是挂到已有项目 ynu-clubs 的
#           443 server 块下，路径前缀 /web_training/ 。
#
#   放置到：/etc/nginx/snippets/web_training.conf
#   然后在该 server 块内加入一行：
#       include /etc/nginx/snippets/web_training.conf;
#   （见同目录 install-route.sh，已做：备份 + 幂等插入 + nginx -t 校验）
#
# 访问映射：
#   https://yaustu.cn/web_training/      ->  /var/www/Web_training/index.html
#   https://yaustu.cn/web_training/TMF/  ->  /var/www/Web_training/TMF/index.html
#   https://47.108.152.17/web_training/  ->  同上（证书名告警属正常）
#
# 说明：/var/www/Web_training/ 即 CI/CD 的部署目标 DEPLOY_PATH，
#       其下按成员姓名分目录：TMF/ YLX/ ZLY/ 。
# =====================================================================

# 无斜杠访问 /web_training 时，跳转到带斜杠，避免落到 =404
location = /web_training {
    return 301 /web_training/;
}

# 挂载本项目根目录（alias 结尾必须带斜杠，与 location 前缀一一对应）
location /web_training/ {
    alias /var/www/Web_training/;
    index index.html;

    try_files $uri $uri/ =404;

    # 静态资源缓存（仅作用于本项目路径，不影响 ynu-clubs）
    location ~* ^/web_training/.+\.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
