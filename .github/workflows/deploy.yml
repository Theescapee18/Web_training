# =====================================================================
# 自动化部署工作流：把 site/ 下【每个成员目录】独立同步到 Nginx 服务器
# ---------------------------------------------------------------------
# 触发条件：推送到 main 分支且改动位于 site/ 下，或手动触发。
#   （成员日常 push 到自己的 TMF/YLX/... 分支，经 PR 评审合入 main 才部署）
#
# 隔离设计（防止一人失误波及其他人）：
#   1. 不再用「整站 rsync --delete」，而是遍历 site/*/ 每个成员目录，
#      分别 rsync 到 <DEPLOY_PATH>/<成员>/ ，--delete 仅作用于该成员子目录；
#      → 部署 TMF 永远不可能删除 YLX/ZLY 的线上文件。
#   2. 每个成员目录同步前，先把将被覆盖/删除的文件备份到
#      /home/deploy/backups/<时间戳>/<成员>/（在站点根之外，不会被访问到），
#      误删可从备份还原。
#   3. site/ 根级的共享文件（如导航 index.html）只覆盖、不做全局 --delete。
#
# GitHub Secrets（Settings → Secrets and variables → Actions）：
#   SERVER_HOST     服务器 IP 或域名
#   SERVER_PORT     SSH 端口（通常是 22）
#   DEPLOY_USER     服务器上的非 root 部署用户（如 deploy）
#   DEPLOY_PATH     站点根目录，需与 nginx alias 一致；本流程用【不带结尾斜杠】
#                   的形式，如 /var/www/Web_training
#   SSH_PRIVATE_KEY CI/CD 专用的 SSH 私钥（见 docs/DEPLOYMENT.md）
# =====================================================================

name: Deploy Static Site

on:
  push:
    branches: [ main ]
    paths:
      - 'site/**'
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

jobs:
  deploy:
    name: per-member isolated rsync deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH (private key + known_hosts)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy each member directory (isolated, per-dir backup)
        env:
          RSH: "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }} -o StrictHostKeyChecking=yes"
          DEST: "${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_PATH }}"
        run: |
          set -euo pipefail
          TS="$(date -u +%Y%m%d%H%M%S)"
          BK="/home/${{ secrets.DEPLOY_USER }}/backups/${TS}"   # 站点根之外的备份位置

          # 1) site/ 根级共享文件（导航首页等）：只覆盖，绝不 --delete 别人的目录
          for f in site/*; do
            [ -f "$f" ] || continue
            echo ">> shared file: $f"
            rsync -avz -e "$RSH" "$f" "$DEST/"
          done

          # 2) 每个成员目录：--delete 仅在各自子目录内生效，互不影响
          for d in site/*/; do
            [ -d "$d" ] || continue
            name="$(basename "$d")"
            echo ">> member dir: $name  (backup -> $BK/$name)"
            rsync -avz --delete \
              --backup --backup-dir="$BK/$name" \
              -e "$RSH" \
              "$d" "$DEST/$name/"
          done

          echo "✅ 完成。本次备份位于服务器：$BK"

      - name: Verify deployment (remote tree listing)
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SERVER_PORT }}" \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_HOST }}" \
            "echo '--- served root ---'; ls -la '${{ secrets.DEPLOY_PATH }}'; \
             echo '--- member dirs ---'; find '${{ secrets.DEPLOY_PATH }}' -maxdepth 1 -type d"
